    <!-- 공통 스크립트 -->
    <script>
        // 스크롤 진행률 바 로직
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("scroll-progress").style.width = scrolled + "%";
        };

        // 등장 애니메이션
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('visible'); }
            });
        }, observerOptions);
        document.querySelectorAll('.fade-in-up').forEach((section) => { observer.observe(section); });

        // 다크모드 토글 로직
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleBtn = document.getElementById('theme-toggle');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // 4. 다국어 토글
        const langToggleBtn = document.getElementById('lang-toggle');
        const translatableElements = document.querySelectorAll('[data-ko]');
        const placeholderElements = document.querySelectorAll('[data-ph-ko]');
        
        let currentLang = localStorage.getItem('site-lang') || 'ko';

        function updateLanguage(lang) {
            translatableElements.forEach(el => { el.innerHTML = el.getAttribute(`data-${lang}`); });
            placeholderElements.forEach(el => { el.setAttribute('placeholder', el.getAttribute(`data-ph-${lang}`)); });
            langToggleBtn.textContent = lang === 'ko' ? 'EN' : 'KO';
            localStorage.setItem('site-lang', lang);
        }

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            updateLanguage(currentLang);
        });

        updateLanguage(currentLang);

    </script>
